<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D6E4F2" id="themeColor">
<title>Vetra AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D6E4F2; --surface:#E6EFF8; --surface-2:#F1F7FC;
  --ink:#17294A; --ink-2:#4B5F82;
  --coral:#FF8FA3; --butter:#FFD36E; --mint:#6FDDB8; --sky:#8CB9F5;
  --hi:rgba(255,255,255,.9); --lo:rgba(92,124,168,.30); --drop:rgba(72,104,152,.32);
  --glow:rgba(255,255,255,.6); --focus:#17294A;
  --font-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
[data-theme="dark"]{
  --bg:#171D33; --surface:#212944; --surface-2:#2A3454;
  --ink:#EEF3FF; --ink-2:#A3B3D9;
  --hi:rgba(255,255,255,.08); --lo:rgba(0,0,0,.42); --drop:rgba(0,0,0,.5);
  --glow:rgba(255,255,255,.05); --focus:#FFFFFF;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  font-family:var(--font-body);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 700px at 8% -10%,var(--glow),transparent 60%),radial-gradient(900px 600px at 100% 110%,var(--glow),transparent 60%),var(--bg);
}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
h1,h2{font-family:var(--font-display);margin:0}

/* ---------- clay primitives ---------- */
.clay{
  background:var(--surface);
  box-shadow:inset 5px 5px 10px var(--hi),inset -7px -7px 14px var(--lo),12px 16px 32px var(--drop),-6px -6px 18px var(--hi);
}
.dent{background:var(--surface);box-shadow:inset 7px 7px 14px var(--lo),inset -6px -6px 12px var(--hi)}
.btn{
  --bh:var(--hi);--bl:var(--lo);
  display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:50%;cursor:pointer;
  width:46px;height:46px;padding:0;flex:none;background:var(--surface-2);color:var(--ink);
  box-shadow:inset 3px 3px 6px var(--bh),inset -4px -5px 9px var(--bl),6px 9px 18px var(--drop);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px) scale(.94);box-shadow:inset 4px 4px 8px var(--bl),inset -3px -3px 6px var(--bh),2px 3px 6px var(--drop)}
.btn.coral{--bh:rgba(255,255,255,.6);--bl:rgba(150,30,70,.25);background:var(--coral);color:#17294A}
.btn.lg{width:54px;height:54px}
.mini{
  border:0;border-radius:50%;width:32px;height:32px;cursor:pointer;display:inline-grid;place-items:center;
  background:var(--surface);color:var(--ink);
  box-shadow:inset 2px 2px 4px var(--hi),inset -2px -2px 5px var(--lo),3px 4px 8px var(--drop);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s;
}
.mini:hover{transform:translateY(-1px)}
.mini:active{transform:scale(.92);box-shadow:inset 3px 3px 5px var(--lo),inset -2px -2px 4px var(--hi)}
.mini.txt{width:auto;border-radius:999px;padding:0 12px;font-weight:600;font-size:.78rem}

/* ---------- generative backdrop ---------- */
.stage{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;transition:opacity .8s}
body.chatting .stage{opacity:.4}
.shape{position:absolute;translate:calc(var(--px,0)*var(--d)*1px) calc(var(--py,0)*var(--d)*1px)}
.shape i{
  display:block;width:100%;height:100%;border-radius:inherit;background:var(--c);
  box-shadow:inset 12px 12px 26px rgba(255,255,255,.55),inset -16px -18px 34px rgba(0,0,0,.16),26px 32px 54px var(--drop);
  animation:drift var(--t) ease-in-out infinite alternate;
}
.s1{--c:var(--coral);--d:24;--t:17s;width:300px;height:300px;right:-90px;top:-100px;border-radius:50%}
.s2{--c:var(--mint);--d:-18;--t:14s;width:110px;height:270px;left:-30px;top:38%;border-radius:55px;rotate:-18deg}
.s3{--c:var(--butter);--d:16;--t:19s;width:200px;height:200px;left:9%;bottom:-80px;border-radius:54px;rotate:-14deg}
.s4{--c:var(--sky);--d:-28;--t:12s;width:130px;height:130px;right:6%;bottom:9%;border-radius:50%}
@keyframes drift{from{transform:translate(0,0) rotate(0) scale(1)}to{transform:translate(16px,-26px) rotate(7deg) scale(1.05)}}

/* ---------- layout ---------- */
.app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column}
.top{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:max(16px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) 4px max(22px,env(safe-area-inset-left));
}
.brand{display:flex;align-items:center;gap:6px}
.orb-mini{width:52px;height:52px;display:block}
.wordmark{font-family:var(--font-display);font-weight:800;font-size:1.55rem;letter-spacing:-.02em}
.tools{display:flex;align-items:center;gap:12px}
.pill{
  display:inline-flex;align-items:center;gap:9px;padding:9px 16px;border-radius:999px;font-weight:700;font-size:.84rem;color:#17294A;
  background:var(--surface-2);white-space:nowrap;
  box-shadow:inset 3px 3px 6px rgba(255,255,255,.55),inset -4px -4px 8px rgba(0,0,0,.12),5px 7px 14px var(--drop);
  transition:background .3s;
}
.pill .pdot{width:11px;height:11px;border-radius:50%;background:#17294A;opacity:.55}
.pill[data-s="thinking"],.pill[data-s="streaming"]{background:var(--butter)}
.pill[data-s="thinking"] .pdot,.pill[data-s="streaming"] .pdot{opacity:1;animation:ping 1s ease-in-out infinite}
.pill[data-s="done"]{background:var(--mint);animation:pop .55s cubic-bezier(.34,1.56,.64,1)}
.pill[data-s="done"] .pdot{opacity:1}
.pill[data-s="cut"],.pill[data-s="incomplete"],.pill[data-s="blocked"],.pill[data-s="error"]{background:var(--coral)}
.pill[data-s="stopped"]{background:var(--sky)}
@keyframes ping{0%,100%{transform:scale(.7)}50%{transform:scale(1.25)}}
@keyframes pop{0%{transform:scale(.85)}100%{transform:scale(1)}}

.main{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow:auto;padding:14px clamp(16px,4vw,44px) 10px;min-height:0;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 18px,#000 calc(100% - 18px),transparent);
  mask-image:linear-gradient(to bottom,transparent 0,#000 18px,#000 calc(100% - 18px),transparent)}
.thread{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:24px;padding-bottom:12px}

/* empty state: Hello + message box, centred together */
.main.is-empty{justify-content:center;padding-bottom:9vh}
.main.is-empty .scroll{flex:none;overflow:visible;padding:0 16px;-webkit-mask-image:none;mask-image:none}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.orb-big{width:min(240px,56vw);aspect-ratio:1;display:block}
.empty h1{font-size:clamp(2.8rem,8vw,4.6rem);font-weight:800;letter-spacing:-.035em;line-height:1}
.empty{animation:rise .9s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes rise{from{opacity:0;transform:scale(.92) translateY(16px)}to{opacity:1;transform:none}}

/* messages */
.msg{display:flex;gap:14px;align-items:flex-start}
.msg.user{justify-content:flex-end}
.avatar{
  flex:none;width:38px;height:38px;border-radius:50%;margin-top:4px;
  background:radial-gradient(circle at 32% 28%,#FFE0E5,#FF8FA3 55%,#EE6A87);
  box-shadow:inset 3px 3px 6px rgba(255,255,255,.65),inset -4px -5px 8px rgba(150,30,70,.3),5px 7px 14px var(--drop);
}
.msg.streaming .avatar{animation:wob 1.1s ease-in-out infinite}
@keyframes wob{50%{transform:scale(1.12,.9)}}
.bubble{border-radius:28px 28px 28px 10px;padding:16px 22px;max-width:min(100%,720px);min-width:0;background:var(--surface-2)}
.ubub{background:var(--butter);color:#17294A;border-radius:28px 28px 10px 28px;box-shadow:inset 4px 4px 9px rgba(255,255,255,.6),inset -6px -6px 12px rgba(150,100,0,.2),10px 14px 26px var(--drop)}
.ubub .content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
.content{line-height:1.65;font-size:1.02rem;overflow-wrap:anywhere}
.model .content{min-height:1.6em}
.err{margin-top:10px;padding:12px 16px;border-radius:18px;font-size:.92rem;line-height:1.5;background:var(--surface);box-shadow:inset 4px 4px 8px var(--lo),inset -4px -4px 8px var(--hi)}
.mfoot{margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border-radius:999px;font-weight:700;font-size:.78rem;color:#17294A;
  box-shadow:inset 2px 2px 4px rgba(255,255,255,.6),inset -3px -3px 6px rgba(0,0,0,.12);
}
.chip svg{width:14px;height:14px}
.chip.generating{background:var(--butter)}
.chip.complete{background:var(--mint);animation:pop .55s cubic-bezier(.34,1.56,.64,1)}
.chip.cut,.chip.error{background:var(--coral)}
.chip.stopped{background:var(--sky)}
.meta{color:var(--ink-2);font-size:.8rem;font-weight:500}
.acts{margin-left:auto;display:flex;gap:8px}
.dots b,.typing b{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin:0 1.5px;animation:hop 1s ease-in-out infinite}
.dots b:nth-child(2),.typing b:nth-child(2){animation-delay:.15s}
.dots b:nth-child(3),.typing b:nth-child(3){animation-delay:.3s}
.typing{padding:8px 0}
.typing b{width:10px;height:10px;margin:0 3px;background:var(--coral);box-shadow:inset 2px 2px 3px rgba(255,255,255,.6),inset -2px -2px 3px rgba(150,30,70,.3)}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

.streaming .content>p:last-child::after,
.streaming .content>h3:last-child::after,.streaming .content>h4:last-child::after,.streaming .content>h5:last-child::after,
.streaming .content>.list>.li:last-child>span:last-child::after{
  content:'';display:inline-block;width:.5em;height:1.05em;margin-left:.25em;border-radius:6px;background:var(--coral);vertical-align:-.16em;animation:caret 1s steps(2) infinite;
}
@keyframes caret{50%{opacity:0}}

/* markdown */
.md>*:first-child{margin-top:0}
.md p{margin:0 0 .8em}
.md h3,.md h4,.md h5,.md h6{margin:1.1em 0 .45em;line-height:1.2;letter-spacing:-.01em;font-family:var(--font-display)}
.md h3{font-size:1.3rem}.md h4{font-size:1.15rem}.md h5,.md h6{font-size:1.02rem}
.md a{color:inherit;font-weight:600;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--coral)}
.md code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;padding:.12em .45em;border-radius:9px;background:var(--surface);box-shadow:inset 2px 2px 4px var(--lo),inset -2px -2px 4px var(--hi)}
.md hr{border:0;height:6px;border-radius:6px;margin:1.2em 0;background:var(--surface);box-shadow:inset 2px 2px 3px var(--lo),inset -2px -2px 3px var(--hi)}
.md blockquote{margin:.8em 0;padding:.6em 1em;border-radius:18px;background:var(--surface);box-shadow:inset 4px 4px 8px var(--lo),inset -4px -4px 8px var(--hi)}
.md blockquote>*:last-child{margin-bottom:0}
.list{margin:0 0 .8em}
.li{display:flex;gap:.7em;margin:.28em 0;padding-left:calc(var(--lv,0)*1.4em)}
.li .mk{flex:none;min-width:1.2em;text-align:right;font-weight:700;color:var(--ink-2)}
.li .mk.bul{width:.62em;height:.62em;min-width:0;margin-top:.62em;border-radius:50%;background:var(--coral);box-shadow:inset 1px 1px 2px rgba(255,255,255,.7),inset -1px -1px 2px rgba(150,30,70,.3)}
.tablewrap{overflow-x:auto;margin:.8em 0;border-radius:18px;box-shadow:inset 4px 4px 8px var(--lo),inset -4px -4px 8px var(--hi)}
.md table{border-collapse:collapse;width:100%;font-size:.93rem}
.md th,.md td{padding:10px 14px;text-align:left;border-bottom:2px solid var(--surface)}
.md th{font-weight:700;background:var(--surface)}
.codeblock{margin:.9em 0;border-radius:22px;overflow:hidden;background:#1B2540;color:#E8EEFF;
  box-shadow:inset 3px 3px 8px rgba(255,255,255,.07),inset -4px -4px 10px rgba(0,0,0,.35),8px 10px 20px var(--drop)}
.cbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 8px 18px;font-size:.78rem;font-weight:600;color:#9FB0D6}
.codeblock .mini{background:#2A3658;color:#E8EEFF;box-shadow:inset 2px 2px 4px rgba(255,255,255,.1),inset -2px -2px 4px rgba(0,0,0,.35),3px 4px 8px rgba(0,0,0,.3)}
.codeblock pre{margin:0;padding:4px 18px 18px;overflow-x:auto}
.codeblock code{display:block;background:none;box-shadow:none;padding:0;font-size:.86rem;line-height:1.6;color:inherit;white-space:pre}

/* composer */
.composer{padding:8px clamp(16px,4vw,44px) max(22px,env(safe-area-inset-bottom))}
.main.is-empty .composer{padding-top:22px}
.inputrow{max-width:740px;margin:0 auto;display:flex;align-items:flex-end;gap:12px;padding:10px 10px 10px 26px;border-radius:36px}
.inputrow textarea{flex:1;border:0;background:none;resize:none;outline:0;padding:15px 0;max-height:190px;line-height:1.5;font-size:1.04rem}
.inputrow textarea::placeholder{color:var(--ink-2);opacity:.85}
.inputrow:focus-within{outline:3px solid var(--focus);outline-offset:3px}
.send.busy{--bh:rgba(255,255,255,.6);--bl:rgba(150,100,0,.22);background:var(--butter)}

/* toast */
.toast{position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom));z-index:60;transform:translate(-50%,30px) scale(.9);opacity:0;pointer-events:none;
  padding:12px 20px;border-radius:999px;font-weight:600;font-size:.9rem;transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .2s}
.toast.on{transform:translate(-50%,0) scale(1);opacity:1}

@media (max-width:560px){
  .top{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
  .avatar{display:none}
  .bubble{padding:14px 16px}
  .pill{padding:8px 12px;font-size:.78rem}
  .tools{gap:8px}
  .btn{width:42px;height:42px}
  .inputrow{padding-left:20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<div class="stage" aria-hidden="true" id="stage">
  <div class="shape s1"><i></i></div>
  <div class="shape s2"><i></i></div>
  <div class="shape s3"><i></i></div>
  <div class="shape s4"><i></i></div>
</div>

<div class="app">
  <header class="top">
    <div class="brand">
      <canvas id="orbMini" class="orb-mini" role="img" aria-label="Vetra logo"></canvas>
      <span class="wordmark">Vetra</span>
    </div>
    <div class="tools">
      <div class="pill" id="pill" role="status" aria-live="polite" data-s="ready" hidden><i class="pdot"></i><span id="pillText">Ready</span></div>
      <button class="btn" id="newChat" aria-label="New chat" title="New chat" hidden></button>
      <button class="btn" id="themeBtn" aria-label="Switch theme"></button>
    </div>
  </header>

  <main class="main is-empty" id="main">
    <section class="scroll" id="scroller">
      <div class="empty" id="empty">
        <canvas id="orbBig" class="orb-big" aria-hidden="true"></canvas>
        <h1>Hello</h1>
      </div>
      <div class="thread" id="thread" hidden></div>
    </section>

    <div class="composer">
      <div class="inputrow dent">
        <textarea id="input" rows="1" placeholder="Message Vetra" aria-label="Message to Vetra"></textarea>
        <button class="btn coral lg send" id="send" aria-label="Send message"></button>
      </div>
    </div>
  </main>
</div>

<div class="toast clay" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   PASTE YOUR GEMINI API KEY BELOW (between the quotes).
   Get one at https://aistudio.google.com/apikey
   ===================================================================== */
const GEMINI_API_KEY=AQ.Ab8RN6JIDXLELI9EMMwQGhL0GaOHfY0lXXlrphC5PVcqbvvRHw';
const GEMINI_MODEL='gemini-2.5-flash';   // any Gemini model id
const TEMPERATURE=0.8;                   // 0 = precise, 1.5 = very creative

(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);

/* ---------- icons ---------- */
const I=(p,w=22)=>`<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICONS={
  send:I('<path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>',24),
  stop:`<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="3.5" fill="currentColor"/></svg>`,
  copy:I('<rect x="9" y="9" width="11" height="11" rx="3"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',15),
  retry:I('<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',15),
  next:I('<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>',15),
  plus:I('<path d="M12 5v14"/><path d="M5 12h14"/>',22),
  moon:I('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'),
  sun:I('<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>'),
  check:I('<path d="M5 12.5l4.5 4.5L19 7.5"/>',14)
};
$('#newChat').innerHTML=ICONS.plus;

/* ---------- storage (falls back to memory if blocked) ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem('vetra.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('vetra.'+k,JSON.stringify(v))}catch(e){}}
};

/* ---------- config ---------- */
const SYSTEM='You are Vetra, a calm, capable AI agent. Be accurate and direct, format answers with Markdown, and ask a short clarifying question only when the request cannot be answered without it.';
const STAT={
  thinking:{c:'generating',t:'Thinking'},
  streaming:{c:'generating',t:'Generating'},
  done:{c:'complete',t:'Complete'},
  cut:{c:'cut',t:'Cut off at the length limit'},
  incomplete:{c:'cut',t:'Ended without a finish signal'},
  stopped:{c:'stopped',t:'Stopped'},
  blocked:{c:'cut',t:'Ended early'},
  error:{c:'error',t:'Failed'}
};
const PILL={thinking:'Thinking…',streaming:'Generating…',done:'Complete',cut:'Cut off',incomplete:'Ended early',stopped:'Stopped',blocked:'Ended early',error:'Failed'};

/* ---------- state ---------- */
const KEY=(GEMINI_API_KEY&&!/^PASTE_/.test(GEMINI_API_KEY))?GEMINI_API_KEY.trim():'';
const S={theme:store.get('theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),busy:false,ctrl:null};
let chat=store.get('chat',null);
if(!chat||!Array.isArray(chat.messages))chat={messages:[]};
chat.messages.forEach(m=>{if(m.status==='thinking'||m.status==='streaming')m.status='stopped';m.meta=m.meta||{}});
const save=()=>store.set('chat',chat.messages.length?chat:null);

/* ---------- text helpers ---------- */
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s){
  const codes=[];
  s=s.replace(/`([^`\n]+)`/g,(_,c)=>{codes.push(c);return '\u0000'+(codes.length-1)+'\u0000'});
  s=esc(s);
  s=s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*\n]*)\*/g,'$1<em>$2</em>').replace(/~~([^~\n]+)~~/g,'<del>$1</del>');
  return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>'<code>'+esc(codes[i])+'</code>');
}
function codeBlock(lang,code){
  return `<div class="codeblock"><div class="cbar"><span>${esc(lang||'text')}</span><button type="button" class="mini txt" data-act="copycode">Copy</button></div><pre><code>${esc(code)}</code></pre></div>`;
}
function md(src){
  const L=src.replace(/\r/g,'').split('\n'),out=[];let i=0;
  const sep=l=>/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l)&&l.includes('-');
  const cells=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  const listRe=/^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  const starter=(l,n)=>/^\s*```/.test(l)||/^#{1,6}\s/.test(l)||listRe.test(l)||/^\s*>/.test(l)||(l.includes('|')&&n!==undefined&&sep(n));
  while(i<L.length){
    const l=L[i];let m;
    if((m=l.match(/^\s*```\s*([\w+#.-]*)/))){
      const buf=[];i++;
      while(i<L.length&&!/^\s*```\s*$/.test(L[i])){buf.push(L[i]);i++}
      i++;out.push(codeBlock(m[1],buf.join('\n')));continue;
    }
    if(!l.trim()){i++;continue}
    if((m=l.match(/^(#{1,6})\s+(.*)$/))){const n=Math.min(m[1].length+2,6);out.push(`<h${n}>${inline(m[2])}</h${n}>`);i++;continue}
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){out.push('<hr>');i++;continue}
    if(/^\s*>/.test(l)){const b=[];while(i<L.length&&/^\s*>/.test(L[i])){b.push(L[i].replace(/^\s*>\s?/,''));i++}out.push('<blockquote>'+md(b.join('\n'))+'</blockquote>');continue}
    if(listRe.test(l)){
      const items=[];
      while(i<L.length&&(m=L[i].match(listRe))){
        const lv=Math.min(3,Math.floor(m[1].replace(/\t/g,'  ').length/2)),num=/\d/.test(m[2]);
        items.push(`<div class="li" role="listitem" style="--lv:${lv}"><span class="mk${num?'':' bul'}" aria-hidden="true">${num?esc(m[2]):''}</span><span>${inline(m[3])}</span></div>`);
        i++;
      }
      out.push('<div class="list" role="list">'+items.join('')+'</div>');continue;
    }
    if(l.includes('|')&&i+1<L.length&&sep(L[i+1])){
      const head=cells(l);i+=2;const rows=[];
      while(i<L.length&&L[i].includes('|')&&L[i].trim()){rows.push(cells(L[i]));i++}
      out.push('<div class="tablewrap"><table><thead><tr>'+head.map(c=>`<th>${inline(c)}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>');
      continue;
    }
    const p=[];
    while(i<L.length&&L[i].trim()&&!(p.length&&starter(L[i],L[i+1]))){p.push(L[i]);i++}
    out.push('<p>'+p.map(inline).join('<br>')+'</p>');
  }
  return out.join('');
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){
    try{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(e2){return false}
  }
}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2000)}

/* ---------- the Vetra orb (generative canvas mascot) ---------- */
const P={x:innerWidth/2,y:innerHeight/2,px:0,py:0,cx:0,cy:0};
addEventListener('pointermove',e=>{P.x=e.clientX;P.y=e.clientY;P.px=(e.clientX/innerWidth-.5)*2;P.py=(e.clientY/innerHeight-.5)*2},{passive:true});
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const BALLS={mint:['#CDF8E8','#6FDDB8','#3DB48C'],butter:['#FFF1C4','#FFD36E','#E8A63A'],sky:['#D8E8FF','#8CB9F5','#5A8CD4']};
class Orb{
  constructor(canvas,{sats=true,scale=.26}={}){
    this.c=canvas;this.ctx=canvas.getContext('2d');this.sats=sats;this.scale=scale;
    this.mode='idle';this.amp=.05;this.spd=.7;this.orbSpd=.3;this.t=Math.random()*10;this.orbit=0;
    this.pulse=0;this.bounce=0;this.happy=0;this.sad=0;this.blink=0;this.nextBlink=2;
    this.look={x:0,y:0};this.resize();
    new ResizeObserver(()=>this.resize()).observe(canvas);
  }
  resize(){const d=Math.min(devicePixelRatio||1,2),r=this.c.getBoundingClientRect();this.w=r.width;this.h=r.height;this.dpr=d;this.c.width=Math.max(1,Math.round(r.width*d));this.c.height=Math.max(1,Math.round(r.height*d))}
  setMode(m){this.mode=m;if(m==='done'&&!RM)this.bounce=1}
  kick(){this.pulse=1}
  visible(){return !document.hidden&&this.c.offsetParent!==null&&this.w>0}
  update(dt){
    const T={idle:[.045,.7,.28],thinking:[.1,2.4,1.7],streaming:[.075,1.7,.9],done:[.04,.8,.3],error:[.02,.35,.08]}[this.mode]||[.045,.7,.28];
    const k=1-Math.pow(.001,dt),f=RM?.15:1;
    this.amp+=(T[0]*(RM?.3:1)-this.amp)*k;this.spd+=(T[1]*f-this.spd)*k;this.orbSpd+=(T[2]*f-this.orbSpd)*k;
    this.t+=dt*this.spd;this.orbit+=dt*this.orbSpd;
    this.pulse=Math.max(0,this.pulse-dt*3.5);this.bounce=Math.max(0,this.bounce-dt*1.15);
    this.happy+=((this.mode==='done'?1:0)-this.happy)*k;
    this.sad+=((this.mode==='error'?1:0)-this.sad)*k;
    this.nextBlink-=dt;
    if(this.nextBlink<0){this.blink=1;this.nextBlink=2.5+Math.random()*3}
    this.blink=Math.max(0,this.blink-dt*7);
    const r=this.c.getBoundingClientRect();
    let tx=Math.max(-1,Math.min(1,(P.x-(r.left+r.width/2))/320)),ty=Math.max(-1,Math.min(1,(P.y-(r.top+r.height/2))/320));
    if(this.mode==='thinking'){tx=.7+Math.sin(this.t*.6)*.2;ty=-.75}
    if(this.mode==='error'){tx=0;ty=.8}
    if(RM){tx=0;ty=0}
    this.look.x+=(tx-this.look.x)*k;this.look.y+=(ty-this.look.y)*k;
  }
  ball(x,y,r,col){
    const c=this.ctx,g=c.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);
    g.addColorStop(0,col[0]);g.addColorStop(.55,col[1]);g.addColorStop(1,col[2]);
    c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();
  }
  draw(){
    const c=this.ctx,{dpr,w,h,t}=this;
    c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
    const R=Math.min(w,h)*this.scale,cx=w/2,cy=h/2;
    const dark=document.documentElement.dataset.theme==='dark';
    const bo=Math.sin((1-this.bounce)*13)*this.bounce;
    const lift=Math.max(0,bo)*R*.3,sx=1-bo*.07,sy=1+bo*.07;
    const sc=1+.015*Math.sin(t*1.3)+.05*this.pulse;
    const rr=R*1.05*(1-lift/R*.25);
    c.save();c.translate(cx,cy+R*1.3);c.scale(1,.17);
    const sg=c.createRadialGradient(0,0,0,0,0,rr),sh=dark?'rgba(0,0,0,':'rgba(60,90,140,';
    sg.addColorStop(0,sh+'.4)');sg.addColorStop(1,sh+'0)');c.fillStyle=sg;c.beginPath();c.arc(0,0,rr,0,7);c.fill();c.restore();
    const sats=[];
    if(this.sats){
      ['mint','butter','sky'].forEach((k,n)=>{const a=this.orbit+n*Math.PI*2/3,z=Math.sin(a);sats.push({x:cx+Math.cos(a)*R*1.62,y:cy+z*R*.36-R*.1-lift,z,r:R*.17*(.86+.14*z),k})});
      sats.filter(s=>s.z<0).forEach(s=>this.ball(s.x,s.y,s.r,BALLS[s.k]));
    }
    c.save();c.translate(cx,cy-lift);c.scale(sx*sc,sy*sc);
    const N=64,pts=[];
    for(let i=0;i<N;i++){
      const a=i/N*Math.PI*2,n=Math.sin(3*a+t)*.5+Math.sin(5*a-t*1.37)*.32+Math.sin(2*a+t*.63)*.4,r=R*(1+this.amp*n);
      pts.push([Math.cos(a)*r,Math.sin(a)*r]);
    }
    c.beginPath();
    for(let i=0;i<N;i++){
      const p=pts[i],q=pts[(i+1)%N],mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2;
      if(i===0)c.moveTo(mx,my);
      const nx=pts[(i+1)%N],nn=pts[(i+2)%N];c.quadraticCurveTo(nx[0],nx[1],(nx[0]+nn[0])/2,(nx[1]+nn[1])/2);
    }
    c.closePath();
    let g=c.createRadialGradient(-R*.35,-R*.4,R*.1,0,0,R*1.2);
    g.addColorStop(0,'#FFD6DD');g.addColorStop(.45,'#FF8FA3');g.addColorStop(1,'#EA6685');
    c.fillStyle=g;c.fill();
    c.save();c.clip();
    g=c.createRadialGradient(-R*.3,-R*.35,R*.7,-R*.2,-R*.25,R*1.6);
    g.addColorStop(0,'rgba(150,30,70,0)');g.addColorStop(1,'rgba(150,30,70,.4)');c.fillStyle=g;c.fillRect(-R*2,-R*2,R*4,R*4);
    g=c.createRadialGradient(R*.55,R*.6,0,R*.55,R*.6,R*.7);
    g.addColorStop(0,'rgba(255,255,255,.22)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(-R*2,-R*2,R*4,R*4);
    c.restore();
    c.save();c.translate(-R*.4,-R*.52);c.rotate(-.6);c.scale(1,.55);
    g=c.createRadialGradient(0,0,0,0,0,R*.3);g.addColorStop(0,'rgba(255,255,255,.8)');g.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=g;c.beginPath();c.arc(0,0,R*.3,0,7);c.fill();c.restore();
    const lx=this.look.x*R*.1,ly=this.look.y*R*.08,ink='#17294A';
    c.fillStyle='rgba(255,255,255,.3)';
    [-1,1].forEach(s=>{c.beginPath();c.ellipse(s*R*.52+lx*.4,R*.2+ly*.4,R*.1,R*.06,0,0,7);c.fill()});
    [-1,1].forEach(s=>{
      const ex=s*R*.3+lx,ey=ly,rx=R*.085,ry=R*.12*(1-this.blink*.9)*(this.mode==='thinking'?.85:1)*(1-this.sad*.3);
      if(this.happy>.02){
        c.globalAlpha=this.happy;c.strokeStyle=ink;c.lineWidth=R*.06;c.lineCap='round';
        c.beginPath();c.arc(ex,ey+R*.04,rx*1.15,Math.PI*1.1,Math.PI*1.9);c.stroke();
      }
      c.globalAlpha=1-this.happy;c.fillStyle=ink;c.beginPath();c.ellipse(ex,ey,rx,Math.max(ry,R*.012),0,0,7);c.fill();
      if(this.blink<.3){c.fillStyle='#fff';c.beginPath();c.arc(ex+rx*.3,ey-ry*.35,rx*.32,0,7);c.fill()}
      c.globalAlpha=1;
    });
    const talk=this.mode==='streaming'?.35+.65*Math.abs(Math.sin(t*3.2)):0,mx=lx*.7,my=R*.2+ly*.5;
    c.fillStyle=ink;c.strokeStyle=ink;c.lineCap='round';
    if(talk>.01){c.beginPath();c.ellipse(mx,my+R*.02,R*.075,R*.025+R*.055*talk,0,0,7);c.fill()}
    else if(this.sad>.5){c.lineWidth=R*.045;c.beginPath();c.arc(mx,my+R*.1,R*.09,Math.PI*1.15,Math.PI*1.85);c.stroke()}
    else{c.lineWidth=R*.045;c.beginPath();c.arc(mx,my-R*.03,R*.1*(1+this.happy*.45),Math.PI*.15,Math.PI*.85);c.stroke()}
    c.restore();
    sats.filter(s=>s.z>=0).forEach(s=>this.ball(s.x,s.y,s.r,BALLS[s.k]));
  }
}
const orbs=[new Orb($('#orbBig'),{sats:true,scale:.26}),new Orb($('#orbMini'),{sats:false,scale:.34})];
const setOrb=m=>orbs.forEach(o=>o.setMode(m));
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  for(const o of orbs){if(o.visible()){o.update(dt);o.draw()}}
  if(!RM){
    P.cx+=(P.px-P.cx)*.06;P.cy+=(P.py-P.cy)*.06;
    const st=$('#stage');st.style.setProperty('--px',P.cx.toFixed(3));st.style.setProperty('--py',P.cy.toFixed(3));
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- rendering ---------- */
const th=$('#thread'),scroller=$('#scroller'),input=$('#input'),sendBtn=$('#send');
let stick=true;
scroller.addEventListener('scroll',()=>{stick=scroller.scrollHeight-scroller.scrollTop-scroller.clientHeight<90},{passive:true});
const toBottom=force=>{if(force||stick)scroller.scrollTop=scroller.scrollHeight};

function footHTML(m,last){
  const st=STAT[m.status]||STAT.error,live=m.status==='thinking'||m.status==='streaming';
  let h=`<span class="chip ${st.c}">${live?'<i class="dots"><b></b><b></b><b></b></i>':(m.status==='done'?ICONS.check:'')}${st.t}</span>`;
  if(!live&&m.meta&&m.meta.ms)h+=`<span class="meta">${(m.meta.ms/1000).toFixed(1)} s${m.meta.tokens?`, ${m.meta.tokens} tokens`:''}</span>`;
  let a='';
  if(m.text&&!live)a+=`<button class="mini" type="button" data-act="copy" aria-label="Copy answer" title="Copy">${ICONS.copy}</button>`;
  if(last&&!S.busy&&!live){
    if(m.text&&['cut','incomplete','stopped'].includes(m.status))a+=`<button class="mini" type="button" data-act="continue" aria-label="Continue answer" title="Continue">${ICONS.next}</button>`;
    a+=`<button class="mini" type="button" data-act="retry" aria-label="Try again" title="Try again">${ICONS.retry}</button>`;
  }
  return h+(a?`<div class="acts">${a}</div>`:'');
}
function patchMsg(el,m,force){
  const live=m.status==='thinking'||m.status==='streaming';
  el.classList.toggle('streaming',live);
  const c=$('.content',el);
  if(m.status==='thinking'&&!m.text)c.innerHTML='<div class="typing" role="img" aria-label="Vetra is thinking"><b></b><b></b><b></b></div>';
  else c.innerHTML=m.text?md(m.text):'';
  const er=$('.err',el),msg=m.meta&&m.meta.error;er.hidden=!msg;
  if(msg)er.textContent=msg;
  const isLast=chat.messages[chat.messages.length-1]===m,key=m.status+'|'+isLast+'|'+S.busy;
  if(force||el.dataset.st!==key){el.dataset.st=key;$('.mfoot',el).innerHTML=footHTML(m,isLast)}
}
function msgEl(m,i){
  const el=document.createElement('article');el.className='msg '+(m.role==='user'?'user':'model');el.dataset.i=i;
  if(m.role==='user'){
    el.innerHTML='<div class="bubble ubub"><div class="content"></div></div>';$('.content',el).textContent=m.text;
  }else{
    el.innerHTML='<div class="avatar" aria-hidden="true"></div><div class="bubble clay"><div class="content md"></div><div class="err" hidden></div><footer class="mfoot"></footer></div>';
    patchMsg(el,m,true);
  }
  return el;
}
function layout(){
  const has=chat.messages.length>0;
  $('#main').classList.toggle('is-empty',!has);
  document.body.classList.toggle('chatting',has);
  $('#empty').hidden=has;th.hidden=!has;
  $('#newChat').hidden=!has;$('#pill').hidden=!has;
}
function renderThread(){
  layout();th.innerHTML='';
  chat.messages.forEach((m,i)=>th.appendChild(msgEl(m,i)));
  stick=true;toBottom(true);
}
function refreshStatus(){
  const m=chat.messages[chat.messages.length-1],pill=$('#pill');
  let s='ready',t='Ready';
  if(m&&m.role==='model'&&STAT[m.status]){s=m.status;t=PILL[m.status]}
  pill.dataset.s=s;$('#pillText').textContent=t;
  document.title=(s==='thinking'||s==='streaming')?'Generating… Vetra AI':'Vetra AI';
  if(S.busy)setOrb(s==='streaming'?'streaming':'thinking');
  else if(orbs[0].mode!=='done')setOrb(s==='error'||s==='blocked'?'error':'idle');
}
function setBusy(b){
  S.busy=b;sendBtn.classList.toggle('busy',b);
  sendBtn.innerHTML=b?ICONS.stop:ICONS.send;
  sendBtn.setAttribute('aria-label',b?'Stop generating':'Send message');
  input.placeholder=b?'Vetra is answering…':'Message Vetra';
}

/* ---------- generation ---------- */
function buildContents(){
  const out=[];
  chat.messages.forEach(m=>{
    if(!m.text)return;
    const role=m.role==='user'?'user':'model';
    if(out.length&&out[out.length-1].role===role)out[out.length-1].parts[0].text+='\n\n'+m.text;
    else out.push({role,parts:[{text:m.text}]});
  });
  while(out.length&&out[0].role!=='user')out.shift();
  return out;
}
function friendlyError(status,apiMsg){
  const raw=apiMsg||'';
  if(status===400&&/api key/i.test(raw))return 'Google rejected the API key. Check GEMINI_API_KEY in the code.';
  if(status===401||status===403)return 'This key cannot use that model, or it is not allowed to call the API. '+raw;
  if(status===404)return 'That model was not found. Check GEMINI_MODEL in the code.';
  if(status===429)return 'Rate limit reached. Wait a moment, then try again.';
  if(status>=500)return 'Gemini is having trouble right now. Try again in a moment.';
  return raw||('Request failed with status '+status+'.');
}
let rafPending=false;
function scheduleUpdate(){
  if(rafPending)return;rafPending=true;
  requestAnimationFrame(()=>{
    rafPending=false;
    const el=th.lastElementChild,m=chat.messages[chat.messages.length-1];
    if(el&&m&&m.role==='model'){patchMsg(el,m);toBottom()}
  });
}
async function generate(){
  const target=chat,reply={role:'model',text:'',status:'thinking',meta:{},t:Date.now()};
  target.messages.push(reply);
  setBusy(true);renderThread();refreshStatus();
  const ctrl=new AbortController();S.ctrl=ctrl;const t0=performance.now();
  let finish=null;
  const body={systemInstruction:{parts:[{text:SYSTEM}]},contents:buildContents(),generationConfig:{temperature:TEMPERATURE}};
  const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(GEMINI_MODEL.replace(/^models\//,''))+':streamGenerateContent?alt=sse';
  const handle=raw=>{
    const data=raw.split(/\r?\n/).filter(l=>l.startsWith('data:')).map(l=>l.slice(5).trimStart()).join('\n');
    if(!data||data==='[DONE]')return;
    let o;try{o=JSON.parse(data)}catch(e){return}
    if(o.error)throw Object.assign(new Error(friendlyError(o.error.code,o.error.message)),{handled:true});
    if(o.promptFeedback&&o.promptFeedback.blockReason){finish='BLOCKED';reply.meta.error='Gemini blocked this prompt ('+String(o.promptFeedback.blockReason).toLowerCase().replace(/_/g,' ')+').'}
    const cand=o.candidates&&o.candidates[0];
    if(cand){
      const parts=(cand.content&&cand.content.parts)||[];
      const txt=parts.filter(p=>p.text&&!p.thought).map(p=>p.text).join('');
      if(txt){
        if(reply.status==='thinking'){reply.status='streaming';if(chat===target)refreshStatus()}
        reply.text+=txt;orbs.forEach(x=>x.kick());if(chat===target)scheduleUpdate();
      }
      if(cand.finishReason)finish=cand.finishReason;
    }
    if(o.usageMetadata&&o.usageMetadata.candidatesTokenCount)reply.meta.tokens=o.usageMetadata.candidatesTokenCount;
  };
  try{
    const res=await fetch(url,{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json','x-goog-api-key':KEY},body:JSON.stringify(body)});
    if(!res.ok){
      let apiMsg='';try{const j=await res.json();apiMsg=(j.error&&j.error.message)||''}catch(e){}
      throw Object.assign(new Error(friendlyError(res.status,apiMsg)),{handled:true});
    }
    const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){
      const {value,done}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      for(;;){const mm=buf.match(/\r?\n\r?\n/);if(!mm)break;const raw=buf.slice(0,mm.index);buf=buf.slice(mm.index+mm[0].length);handle(raw)}
    }
    if(buf.trim())handle(buf);
    if(finish==='STOP')reply.status='done';
    else if(finish==='MAX_TOKENS')reply.status='cut';
    else if(finish==='BLOCKED')reply.status='blocked';
    else if(finish&&finish!=='FINISH_REASON_UNSPECIFIED'){reply.status='blocked';reply.meta.error='Gemini ended this answer early ('+finish.toLowerCase().replace(/_/g,' ')+').'}
    else if(!reply.text){reply.status='error';reply.meta.error='Gemini returned an empty answer. Try again.'}
    else reply.status='incomplete';
  }catch(e){
    if(e.name==='AbortError')reply.status='stopped';
    else{
      reply.status='error';
      reply.meta.error=e.handled?e.message:(e instanceof TypeError?'Could not reach Gemini. Check your connection and try again.':(e.message||'Something went wrong.'));
    }
  }
  reply.meta.ms=performance.now()-t0;
  S.ctrl=null;setBusy(false);save();
  if(chat===target){
    const el=th.lastElementChild;if(el)patchMsg(el,reply,true);
    if(reply.status==='done'){
      setOrb('done');refreshStatus();
      setTimeout(()=>{if(!S.busy){setOrb('idle')}},2600);
    }else{setOrb(reply.status==='error'||reply.status==='blocked'?'error':'idle');refreshStatus()}
    toBottom();
  }
}
function stopGen(){if(S.ctrl)S.ctrl.abort()}
function send(text){
  text=(text===undefined?input.value:text).trim();
  if(!text||S.busy)return;
  chat.messages.push({role:'user',text,t:Date.now(),meta:{}});
  input.value='';autosize();stick=true;
  if(!KEY){
    chat.messages.push({role:'model',text:'',status:'error',meta:{error:'Add your Gemini API key to GEMINI_API_KEY at the top of the code, then reload this page.'},t:Date.now()});
    save();renderThread();refreshStatus();return;
  }
  generate();
}
function retry(){
  if(S.busy)return;
  const m=chat.messages[chat.messages.length-1];
  if(!m||m.role!=='model')return;
  chat.messages.pop();
  if(!chat.messages.length||chat.messages[chat.messages.length-1].role!=='user'){renderThread();refreshStatus();return}
  generate();
}
function newChat(){
  if(S.busy)stopGen();
  chat={messages:[]};save();setOrb('idle');renderThread();refreshStatus();input.focus();
}

/* ---------- events ---------- */
th.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,art=b.closest('.msg'),m=art&&chat.messages[+art.dataset.i];
  if(act==='copy'&&m)toast(await copyText(m.text)?'Copied':'Copy failed');
  else if(act==='copycode')toast(await copyText(b.closest('.codeblock').querySelector('code').textContent)?'Copied':'Copy failed');
  else if(act==='retry')retry();
  else if(act==='continue')send('Continue');
});
sendBtn.addEventListener('click',()=>S.busy?stopGen():send());
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!S.busy)send()}});
function autosize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,190)+'px'}
input.addEventListener('input',autosize);
$('#newChat').onclick=newChat;

function applyTheme(){
  document.documentElement.dataset.theme=S.theme;
  $('#themeBtn').innerHTML=S.theme==='dark'?ICONS.sun:ICONS.moon;
  $('#themeBtn').setAttribute('aria-label',S.theme==='dark'?'Switch to light theme':'Switch to dark theme');
  $('#themeColor').content=S.theme==='dark'?'#171D33':'#D6E4F2';
}
$('#themeBtn').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';store.set('theme',S.theme);applyTheme()};

/* ---------- boot ---------- */
applyTheme();setBusy(false);renderThread();refreshStatus();
})();
</script>
</body>
</html>
